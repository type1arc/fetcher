[package]
name = "fetcher"
version = "0.4.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
toml = "0.8"
xz2 = "0.1"
zip = "8.6.0"
zstd = "0.13"
