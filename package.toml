
# ********************************************************************
# ************************** fetcher/fetchy **************************  
# ********************************************************************

# manifest for fetcher/fetchy package manager

[pkg_name]
name = "some-package"
version = "1.0.0"

# default source config – used by any dep without its own source override
[source]
# Use a specific GitHub org as the default
github = "serde-rs"
# or a custom registry template (uncomment to use):
# registry = "https://crates.io/api/v1/crates/{name}/{version}/download"
# or a direct URL template:
# url = "https://releases.example.com/{name}/v{version}.zip"

[deps]
# uses the default [source] — downloads serde-rs/serde archive from GitHub
serde = "1.0"
serde_json = "1.0"

# explicit GitHub repo (different org than the default)
tokio = { version = "1.51", github = "tokio-rs/tokio" }

# direct URL download
my-custom-lib = { version = "2.0", url = "https://example.com/downloads/{name}-{version}.zip" }

# git clone (requires `git` CLI)
my-internal-lib = { git = "https://github.com/myorg/my-internal-lib.git", rev = "main" }

# git clone without a specific rev (default branch)
other-internal = { git = "https://github.com/myorg/other.git" }
