# fetcher.conf
# List of package repositories fetcher scans when searching for a package
# (fetcher fetch <pkg> without --github/--url/--git/--from-source).
#
# When this file exists, fetcher scans exactly the repos listed below.
# Safety valve:
#   - include_system = true  → also scan your system-configured repos
#                              (/etc/apt/sources.list*, /etc/pacman.conf,
#                              /etc/apk/repositories)
#   - include_system = false → scan ONLY the repos listed here
#                              (default when the file exists)
#
# If no fetcher.conf is found, fetcher falls back to scanning all
# system-configured repos.
#
# Lookup order (first match wins):
#   1. $FETCHER_CONFIG
#   2. ./fetcher.conf
#   3. $XDG_CONFIG_HOME/fetcher/fetcher.conf  (default ~/.config/fetcher/fetcher.conf)
#   4. /etc/fetcher.conf

include_system = true

# APT-style distro repositories
[[apt]]
uri = "https://deb.debian.org/debian"
suite = "bookworm"
components = ["main", "contrib", "non-free"]

# Pacman-style distro repositories
[[pacman]]
name = "core"
server = "https://geo.mirror.pkgbuild.com/$repo/os/$arch"

# Alpine package repositories
[[apk]]
uri = "https://dl-cdn.alpinelinux.org/alpine/v3.20/main"